name: Python bindings

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-python-bindings:
    name: Build Python bindings (${{ matrix.platform }}, Python ${{ matrix.python-version }}, Boost ${{ matrix.boost-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            os: ubuntu-22.04
            python-version: "3.10"
            boost-version: "1.74"
            artifact-name: nekoriichi-linux-py310-boost174

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libboost1.74-dev libboost-filesystem1.74-dev libboost-graph1.74-dev libboost-system1.74-dev pybind11-dev
          grep "BOOST_LIB_VERSION" /usr/include/boost/version.hpp
          python -m pip install --upgrade pip
          python -m pip install numpy

      - name: Install Windows dependencies
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          vcpkg install boost-dll:x64-windows boost-filesystem:x64-windows boost-graph:x64-windows boost-system:x64-windows
          python -m pip install --upgrade pip
          python -m pip install numpy

      - name: Configure Linux
        if: runner.os == 'Linux'
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DBUILD_SERVER=OFF
          -DBUILD_SAMPLES=OFF
          -DBUILD_TEST=OFF
          -DBUILD_PYTHON=ON

      - name: Configure Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: >
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64
          -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"
          -DBUILD_SERVER=OFF
          -DBUILD_SAMPLES=OFF
          -DBUILD_TEST=OFF
          -DBUILD_PYTHON=ON

      - name: Build
        run: cmake --build build --target nekoriichi --config Release

      - name: Package Python module
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifact | Out-Null
          $module = Get-ChildItem -Path build -Recurse -File -Include "nekoriichi*.so","nekoriichi*.pyd" | Select-Object -First 1
          if (-not $module) {
            throw "nekoriichi extension was not built"
          }
          Copy-Item $module.FullName artifact/
          if ($env:RUNNER_OS -eq "Windows") {
            $vcpkgBin = Join-Path $env:VCPKG_INSTALLATION_ROOT "installed/x64-windows/bin"
            if (Test-Path $vcpkgBin) {
              Copy-Item (Join-Path $vcpkgBin "*.dll") artifact/ -ErrorAction SilentlyContinue
            }
          }
          Copy-Item data/config/* artifact/
          @'
          import os
          import sys
          import numpy as np

          artifact_dir = os.path.dirname(os.path.abspath(__file__))
          os.environ.setdefault("MAHJONG_CPP_DATA_DIR", artifact_dir)
          sys.path.insert(0, artifact_dir)

          import nekoriichi

          def check_features(name, **kwargs):
              arr = nekoriichi.calc_expected_features(**kwargs)
              assert arr.shape == (12, 34), (name, arr.shape)
              assert arr.dtype == np.float32, (name, arr.dtype)
              assert np.isfinite(arr).all(), name
              assert arr.min() >= 0.0, (name, arr.min())
              assert arr.max() <= 1.0, (name, arr.max())
              assert np.count_nonzero(arr) > 0, name
              assert np.isin(arr[9:12], [0.0, 1.0]).all(), name
              return arr

          cases = [
              (
                  "base",
                  dict(
                      hand_mpsz="222567m345p33667s",
                      bakaze="E",
                      jikaze="E",
                      dora_indicators=["1z"],
                      t_max=12,
                      enable_uradora=False,
                  ),
              ),
              (
                  "open_hand",
                  dict(
                      hand_mpsz="222567m345p33s",
                      bakaze="E",
                      jikaze="S",
                      dora_indicators=["1z"],
                      visible_tiles_mpsz="456z",
                      melds=[{"type": "chi", "tiles": "123s"}],
                      t_max=12,
                      enable_uradora=False,
                  ),
              ),
              (
                  "honors_regression_default",
                  dict(
                      hand_mpsz="15688m46799p6s237z",
                      bakaze="E",
                      jikaze="W",
                      dora_indicators=[],
                      visible_tiles_mpsz="",
                      melds=[],
                      t_max=12,
                      extra=1,
                      enable_uradora=False,
                  ),
              ),
              (
                  "honors_regression_235z",
                  dict(
                      hand_mpsz="15688m46799p6s235z",
                      bakaze="E",
                      jikaze="E",
                      dora_indicators=[],
                      t_max=12,
                      extra=1,
                      enable_uradora=False,
                  ),
              ),
              (
                  "honors_regression_234z",
                  dict(
                      hand_mpsz="15688m46799p6s234z",
                      bakaze="S",
                      jikaze="W",
                      dora_indicators=[],
                      t_max=12,
                      extra=1,
                      enable_uradora=False,
                  ),
              ),
              (
                  "mixed_souzu_honors_regression",
                  dict(
                      hand_mpsz="15688m46799p16s37z",
                      bakaze="E",
                      jikaze="N",
                      dora_indicators=[],
                      t_max=12,
                      extra=1,
                      enable_uradora=False,
                  ),
              ),
              (
                  "no_honor_control",
                  dict(
                      hand_mpsz="15688m46799p1667s",
                      bakaze="E",
                      jikaze="E",
                      dora_indicators=[],
                      t_max=12,
                      extra=1,
                      enable_uradora=False,
                  ),
              ),
          ]

          results = {}
          for name, kwargs in cases:
              results[name] = check_features(name, **kwargs)

          crash_regression_hand = "15688m46799p6s237z"
          regression_extra0 = check_features(
              "honors_regression_extra0",
              hand_mpsz=crash_regression_hand,
              bakaze="E",
              jikaze="W",
              dora_indicators=[],
              visible_tiles_mpsz="",
              melds=[],
              t_max=12,
              extra=0,
              enable_uradora=False,
          )

          print("nekoriichi runtime verification passed")
          for name, arr in results.items():
              print(f"{name} sum:", float(arr.sum()))
          print("regression extra0 sum:", float(regression_extra0.sum()))
          '@ | Set-Content -Encoding UTF8 artifact/verify_nekoriichi.py

      - name: Verify packaged artifact
        run: python artifact/verify_nekoriichi.py

      - name: Upload Python module artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: artifact/

      - name: Smoke test Python module
        if: runner.os == 'Linux'
        env:
          MAHJONG_CPP_DATA_DIR: ${{ github.workspace }}/build
        run: |
          python - <<'PY'
          import glob
          import importlib.util
          import numpy as np

          modules = glob.glob("build/nekoriichi*.so")
          assert modules, "nekoriichi extension was not built"

          spec = importlib.util.spec_from_file_location("nekoriichi", modules[0])
          nekoriichi = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(nekoriichi)

          def check_features(name, **kwargs):
              arr = nekoriichi.calc_expected_features(**kwargs)
              assert arr.shape == (12, 34), (name, arr.shape)
              assert str(arr.dtype) == "float32", (name, arr.dtype)
              assert np.isfinite(arr).all(), name
              assert arr.min() >= 0.0, (name, arr.min())
              assert arr.max() <= 1.0, (name, arr.max())
              assert np.count_nonzero(arr) > 0, name
              assert np.isin(arr[9:12], [0.0, 1.0]).all(), name
              return arr

          cases = [
              ("base", dict(hand_mpsz="222567m345p33667s", bakaze="E", jikaze="E", dora_indicators=["1z"], t_max=12, enable_uradora=False)),
              ("open_hand", dict(hand_mpsz="222567m345p33s", bakaze="E", jikaze="S", dora_indicators=["1z"], visible_tiles_mpsz="456z", melds=[{"type": "chi", "tiles": "123s"}], t_max=12, enable_uradora=False)),
              ("honors_regression_default", dict(hand_mpsz="15688m46799p6s237z", bakaze="E", jikaze="W", dora_indicators=[], visible_tiles_mpsz="", melds=[], t_max=12, extra=1, enable_uradora=False)),
              ("honors_regression_235z", dict(hand_mpsz="15688m46799p6s235z", bakaze="E", jikaze="E", dora_indicators=[], t_max=12, extra=1, enable_uradora=False)),
              ("honors_regression_234z", dict(hand_mpsz="15688m46799p6s234z", bakaze="S", jikaze="W", dora_indicators=[], t_max=12, extra=1, enable_uradora=False)),
              ("mixed_souzu_honors_regression", dict(hand_mpsz="15688m46799p16s37z", bakaze="E", jikaze="N", dora_indicators=[], t_max=12, extra=1, enable_uradora=False)),
              ("no_honor_control", dict(hand_mpsz="15688m46799p1667s", bakaze="E", jikaze="E", dora_indicators=[], t_max=12, extra=1, enable_uradora=False)),
          ]

          for name, kwargs in cases:
              check_features(name, **kwargs)

          crash_regression_hand = "15688m46799p6s237z"
          check_features("honors_regression_extra0", hand_mpsz=crash_regression_hand, bakaze="E", jikaze="W", dora_indicators=[], visible_tiles_mpsz="", melds=[], t_max=12, extra=0, enable_uradora=False)
          PY
